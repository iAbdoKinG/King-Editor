# Builds the Windows desktop app on every update and publishes it to the
# rolling "desktop-latest" release (stable download links used by the site).
name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and portable app
        shell: bash
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la
          test -f Qissa-Setup.exe && test -f Qissa-Portable.exe
          NOTES="Qissa for Windows — built from ${GITHUB_SHA::7} on $(date -u +%F). Installer: Qissa-Setup.exe · Portable: Qissa-Portable.exe"
          if gh release view desktop-latest >/dev/null 2>&1; then
            # Remove assets from the previous name
            gh release delete-asset desktop-latest KING-EDITOR-Setup.exe -y 2>/dev/null || true
            gh release delete-asset desktop-latest KING-EDITOR-Portable.exe -y 2>/dev/null || true
            gh release edit desktop-latest --title "Qissa for Windows"
            gh release upload desktop-latest Qissa-Setup.exe Qissa-Portable.exe --clobber
            gh release edit desktop-latest --notes "$NOTES"
          else
            gh release create desktop-latest Qissa-Setup.exe Qissa-Portable.exe --title "Qissa for Windows" --notes "$NOTES" --latest
          fi
